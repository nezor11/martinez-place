# Weekly dependency updates. Every PR runs the full CI (lint, typecheck,
# build, e2e, Lighthouse), so minor and patch bumps arrive grouped in one PR
# and majors come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
