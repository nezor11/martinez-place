name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fetch resume content
        run: yarn fetch-resume --strict

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build site
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse
        run: yarn lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7

  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    # Dependabot PRs cannot read repository secrets.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic needs the history to find the baseline commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish Storybook and compare snapshots
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          # Changes on main become the new baseline; PRs report them for review.
          autoAcceptChanges: main
          exitZeroOnChanges: true
          onlyChanged: true
